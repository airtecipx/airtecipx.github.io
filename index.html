<!doctype html>
<html lang="ko">
<head>

<meta name="description" content="에어텍ipx — K-POP 아티스트 IP 굿즈를 기획·제작·유통하는 감성 기반 IP 크리에이티브 브랜드">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
<title>에어텍 IPX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<style>
/* Layout: pinned logo intro → about sentence fills word by word (navy) → stats list with photo card over the text (white) → artists drawn in line then filled (white grid) ; Heron-style cell menu on top */
:root {
  --white: #ffffff;
  --paper: #f5f7fb;
  --navy: #17244a;
  --navy-deep: #0f1934;
  --navy-soft: #5a6684;
  --mist: #d3d9e6;
  --grid: rgba(23, 36, 74, .08);
  --font-display: "Saira", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--navy); font-family: var(--font-body); line-height: 1.6; }
#main { transform-origin: 50% 40vh; transition: transform .45s cubic-bezier(.7,0,.3,1), opacity .45s; }
#main.away { transform: scale(.94); opacity: 0; }

/* Header: logo + Heron-style menu cells */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 30;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  --fg: var(--navy); --bg: var(--paper);
  color: var(--fg);
  opacity: 0; pointer-events: none; transition: opacity .35s;
}
.top.show { opacity: 1; pointer-events: auto; }
.top.dark { --fg: var(--white); --bg: var(--navy); }
.top-in { display: flex; align-items: stretch; justify-content: space-between; height: 64px; border-bottom: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
.brand { width: 110px; align-self: center; display: block; color: inherit; }
.brand svg { width: 100%; height: auto; display: block; }
.cells { display: flex; list-style: none; margin: 0; padding: 0; }
.cell { position: relative; border-left: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
.cell > button, .sub button {
  position: relative; display: block; height: 100%; min-width: 132px; padding: 10px 14px 0;
  background: none; border: 0; color: inherit; text-align: left; cursor: pointer;
  font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: .14em;
}
/* Menu hover: an ink circle spreads from where the pointer came in (white text inside it, navy outside), letters roll up one by one */
.cell > button .lbl, .sub button .lbl { position: relative; z-index: 1; display: inline-block; white-space: nowrap; }
.ink { position: absolute; inset: 0; z-index: 2; padding: inherit; display: flex; align-items: center; justify-content: flex-start; background: var(--fg); color: var(--bg); pointer-events: none; clip-path: circle(0px at var(--x, 50%) var(--y, 50%)); transition: clip-path .5s cubic-bezier(.7,0,.25,1); }
.on > .ink { clip-path: circle(var(--r, 200px) at var(--x, 50%) var(--y, 50%)); }
.ch { display: inline-block; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: top; }
.ch > span { display: block; transition: transform .5s cubic-bezier(.7,0,.25,1); transition-delay: calc(var(--i) * 24ms); }
.ch > span i { display: block; font-style: normal; height: 1.25em; }
.on .ch > span { transform: translateY(-1.25em); }
@media (prefers-reduced-motion: reduce) { .ink, .ch > span { transition: none; } }
.cell > button::after { content: ""; position: absolute; right: 5px; bottom: 5px; width: 6px; height: 6px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; opacity: .5; }
.dot { position: absolute; z-index: 3; left: 14px; bottom: 12px; width: 5px; height: 5px; background: #ff5a1f; opacity: 0; transition: opacity .15s; }
.cell.lit .dot { opacity: 1; }
.sub {
  position: absolute; left: -1px; top: 100%; list-style: none; margin: 0; padding: 0; min-width: calc(100% + 1px);
  background: var(--bg); border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); border-top: 0;
  visibility: hidden; opacity: 0; transform: translateY(-4px); transition: opacity .18s, transform .18s, visibility .18s;
}
.cell:hover .sub, .cell:focus-within .sub { visibility: visible; opacity: 1; transform: none; }
.sub li { position: relative; height: 38px; }
.sub li + li { border-top: 1px solid color-mix(in srgb, var(--fg) 14%, transparent); }
.sub button { width: 100%; padding: 0 14px; font-size: 12px; white-space: nowrap; }
.menu-toggle { display: none; }
@media (max-width: 900px) {
  .cells { display: none; }
  .menu-toggle { display: block; align-self: stretch; background: none; border: 0; border-left: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); color: inherit; font-family: var(--font-display); letter-spacing: .14em; padding: 0 18px; }
  .top.open .cells { display: block; position: absolute; left: 0; right: 0; top: 64px; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top.open .cell { border-left: 0; border-bottom: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
  .top.open .cell > button { height: 52px; width: 100%; }
  .top.open .sub { position: static; visibility: visible; opacity: 1; transform: none; border: 0; }
}

/* 1. Logo intro — plays by itself (~6.4s) on a full-screen stage */
.intro { position: relative; height: 100vh; height: 100svh; }
.stage { position: relative; height: 100%; overflow: hidden; background: var(--paper); }
#art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; gap: 16px;
  font: 500 11px/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .18em; color: var(--navy-soft);
  font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0;
}
.hud span:first-child b { color: var(--navy); font-weight: 500; margin-right: 1.2em; }
.hud.inv, .hud.inv span:first-child b { color: var(--white); }
.hint { position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 12px; letter-spacing: .3em; color: var(--white); opacity: 0; }
.hint i { width: 1px; height: 44px; background: linear-gradient(currentColor, transparent); animation: drip 1.8s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* 2. About — words fill as you scroll */
.about { position: relative; height: 260vh; background: var(--navy); color: var(--white); }
.about-pin { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.about-in { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
.label { font-family: var(--font-display); font-size: 13px; letter-spacing: .32em; margin: 0; opacity: .6; }
.fill-text { margin: 0; font-weight: 700; font-size: clamp(28px, 4.6vw, 64px); line-height: 1.4; letter-spacing: -.01em; text-wrap: balance; }
.fill-text .w { color: rgba(255, 255, 255, .16); transition: color .25s; }
.fill-text .w.on { color: var(--white); }

/* 3. Stats list with photo card */
.stats { position: relative; height: 440vh; background: var(--paper); }
.stats-pin { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
.list { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: clamp(34px, 7vw, 118px); line-height: 1.08; letter-spacing: -.01em; pointer-events: none; }
.list .row { display: block; white-space: nowrap; padding-inline: 16px; }
.list.base .row { color: var(--mist); transition: color .3s; }
.list.base .row.on { color: var(--navy); }
.list.top { color: var(--white); z-index: 3; }
.card { position: absolute; left: 50%; top: 50%; width: min(30vw, 400px); aspect-ratio: 4 / 3; max-width: 100%; transform: translate(-50%, -50%); z-index: 2; overflow: hidden; background: var(--navy); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; clip-path: inset(100% 0 0 0); transition: clip-path .7s cubic-bezier(.7,0,.25,1); }
.card img.on { clip-path: inset(0 0 0 0); }
.card img.prev { clip-path: inset(0 0 0 0); z-index: 0; transition: none; }
.card img.on { z-index: 1; }
.caption { position: absolute; left: 50%; top: calc(50% + min(15vw, 200px) * .75 + 18px); transform: translateX(-50%); z-index: 4; font-family: var(--font-display); font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: var(--navy-soft); white-space: nowrap; }
.stats .label, .artists .label { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(96px + env(safe-area-inset-top, 0px)); color: var(--navy); }
.counter { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(96px + env(safe-area-inset-top, 0px)); font-family: var(--font-display); font-size: 13px; letter-spacing: .2em; font-variant-numeric: tabular-nums; color: var(--navy-soft); }
@media (max-width: 700px) { .card { width: 62vw; } .caption { top: calc(50% + 31vw * .75 + 14px); } }

/* 4. Artists — cut-out photos on a sideways track (scroll or arrows); pointing lifts one, clicking opens its products */
.artists { position: relative; height: 340vh; background: var(--paper); }
.artists-pin {
  position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px; background-position: center;
}
.lineup { position: absolute; left: 0; top: 50%; display: flex; align-items: flex-end; gap: clamp(56px, 8vw, 140px); padding-inline: max(24px, 10vw); transform: translateY(-50%); will-change: transform; }
.idol { position: relative; flex: none; display: grid; gap: 16px; justify-items: start; padding: 0; background: none; border: 0; color: var(--navy); cursor: pointer; text-align: left; transition: opacity .35s, transform .35s cubic-bezier(.2,.8,.2,1); }
.idol img { display: block; height: var(--h, 40vh); width: auto; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.idol.on, .idol:hover, .idol:focus-visible { transform: translateY(-8px); }
.idol:hover img, .idol:focus-visible img { transform: scale(1.02); transform-origin: 50% 100%; }
.idol .tag { display: flex; align-items: baseline; gap: 14px; font-family: var(--font-display); }
.idol .tag i { font-style: normal; font-size: 12px; letter-spacing: .2em; color: var(--navy-soft); font-variant-numeric: tabular-nums; }
.idol .tag b { font-weight: 600; font-size: clamp(18px, 2vw, 26px); letter-spacing: .02em; text-transform: uppercase; }
.idol .go { position: absolute; left: 0; bottom: -26px; font-family: var(--font-display); font-size: 12px; letter-spacing: .22em; white-space: nowrap; opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .25s; }
.idol.on .go, .idol:hover .go, .idol:focus-visible .go { opacity: 1; transform: none; }
.art-nav { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; }
.art-arrow { width: 56px; height: 44px; display: grid; place-items: center; padding: 0; background: var(--paper); color: var(--navy); border: 1px solid rgba(23,36,74,.3); cursor: pointer; transition: background .25s, color .25s, opacity .25s; }
.art-arrow + .art-arrow { border-left: 0; }
.art-arrow svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: square; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.art-arrow:hover:not(:disabled), .art-arrow:focus-visible { background: var(--navy); color: var(--white); }
#artPrev:hover:not(:disabled) svg { transform: translateX(-3px); }
#artNext:hover:not(:disabled) svg { transform: translateX(3px); }
.art-arrow:disabled { opacity: .3; cursor: default; }
.idol:focus-visible { outline: 2px solid #ff5a1f; outline-offset: 10px; }
.art-hint { position: absolute; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(32px + env(safe-area-inset-bottom, 0px)); margin: 0; font-family: var(--font-display); font-size: 12px; letter-spacing: .24em; color: var(--navy-soft); }

/* Page transition (menu click) + inner pages */
.tx { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow-y: auto; overscroll-behavior: contain; }
.tx.on { pointer-events: auto; }
.tx > svg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tx line { stroke: rgba(23,36,74,.16); stroke-width: 1; }
.tx .bar { position: fixed; background: var(--navy); z-index: 2; }
.page { position: relative; opacity: 0; transition: opacity .4s; padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
.page.on { opacity: 1; }
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band-in { max-width: 1180px; margin: 0 auto; }
.pg-head { padding-block: 56px 0; }
.crumb { margin: 0 0 14px; font-family: var(--font-display); font-size: 13px; letter-spacing: .3em; color: var(--navy-soft); }
.pg-title { display: inline-block; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 6vw, 80px); line-height: 1; letter-spacing: .02em; color: var(--white); background: var(--navy); padding: 18px 28px 16px; }
.tabs { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; border-top: 1px solid rgba(23,36,74,.22); border-bottom: 1px solid rgba(23,36,74,.22); }
.tabs li + li { border-left: 1px solid rgba(23,36,74,.22); }
.tabs button { background: none; border: 0; padding: 14px 20px; font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: .14em; color: var(--navy); cursor: pointer; }
.tabs button:hover, .tabs button:focus-visible, .tabs button.cur { background: var(--navy); color: var(--white); }
.pg-body { padding-block: 64px 96px; }
.pg-body h3 { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 2.6vw, 32px); letter-spacing: .04em; margin: 0 0 18px; }
.pg-body h4 { font-size: 19px; margin: 0 0 8px; }
.pg-body p { margin: 0 0 14px; max-width: 64ch; }
.lead { font-size: clamp(22px, 2.8vw, 36px); font-weight: 700; line-height: 1.4; max-width: 30ch; text-wrap: balance; margin: 0 0 28px; }
.muted { color: var(--navy-soft); }
.stack { display: grid; gap: 72px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.two img, .media-img img, .wide-img { width: 100%; height: auto; display: block; }
.sign { width: 220px; margin-top: 18px; mix-blend-mode: multiply; }
.rows { border-top: 1px solid var(--navy); }
.rows > div { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; padding: 16px 0; border-bottom: 1px solid rgba(23,36,74,.16); }
.rows dt, .rows .k { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.rows dd { margin: 0; }
.numbers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--navy); border-bottom: 1px solid var(--navy); }
.numbers > div { padding: 22px 18px; min-width: 0; }
.numbers > div + div { border-left: 1px solid rgba(23,36,74,.16); }
.numbers b { display: block; font-family: var(--font-display); font-weight: 600; font-size: clamp(34px, 4.4vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
.numbers span { font-family: var(--font-display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--navy-soft); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.docs img { width: 100%; height: auto; display: block; border: 1px solid rgba(23,36,74,.14); background: var(--white); }
/* Product select — game-style: scrolling picks one product at a time; big card + roster */
.sel { position: relative; margin-top: -24px; }
.sel-pin { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); height: calc(100vh - 64px - env(safe-area-inset-top, 0px)); height: calc(100svh - 64px - env(safe-area-inset-top, 0px)); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: clamp(24px, 5vw, 72px); align-items: center; padding-block: 20px 18px; }
.sel-stage { position: relative; justify-self: center; width: min(54vh, 100%); aspect-ratio: 1; max-width: 100%; }
.sel-card { position: absolute; inset: 0; overflow: hidden; background: var(--white); border: 1px solid rgba(23,36,74,.12); }
.sel-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sel-card img.in { animation: selIn .5s cubic-bezier(.7,0,.25,1) both; }
.sel-card img.in.up { animation-name: selInUp; }
@keyframes selIn { from { clip-path: inset(100% 0 0 0); transform: scale(1.06); } to { clip-path: inset(0 0 0 0); transform: none; } }
@keyframes selInUp { from { clip-path: inset(0 0 100% 0); transform: scale(1.06); } to { clip-path: inset(0 0 0 0); transform: none; } }
.sel-br { position: absolute; inset: -14px; pointer-events: none; }
.sel-br i { position: absolute; width: 22px; height: 22px; border: 0 solid var(--navy); }
.sel-br i:nth-child(1) { left: 0; top: 0; border-left-width: 2px; border-top-width: 2px; }
.sel-br i:nth-child(2) { right: 0; top: 0; border-right-width: 2px; border-top-width: 2px; }
.sel-br i:nth-child(3) { right: 0; bottom: 0; border-right-width: 2px; border-bottom-width: 2px; }
.sel-br i:nth-child(4) { left: 0; bottom: 0; border-left-width: 2px; border-bottom-width: 2px; }
.sel-br.pulse { animation: selPulse .45s cubic-bezier(.2,.8,.2,1); }
@keyframes selPulse { 0% { transform: scale(1.06); opacity: .3; } 100% { transform: none; opacity: 1; } }
.sel-info { display: grid; gap: 16px; align-content: center; min-width: 0; }
.sel-idx { margin: 0; font: 500 13px/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: .16em; color: var(--navy-soft); font-variant-numeric: tabular-nums; }
.sel-idx b { font-weight: 500; font-size: clamp(40px, 6vw, 84px); letter-spacing: -.02em; color: var(--navy); margin-right: 10px; }
.sel-name { margin: 0; min-height: 2.6em; font-family: var(--font-body); font-weight: 700; font-size: clamp(20px, 2.4vw, 32px); line-height: 1.3; overflow: hidden; text-wrap: balance; }
.sel-name span { display: block; animation: selName .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes selName { from { transform: translateY(60%); opacity: 0; } }
.sel-meta { margin: 0; font-family: var(--font-display); font-size: 13px; letter-spacing: .22em; color: var(--navy-soft); text-transform: uppercase; }
.sel-bar { height: 2px; background: rgba(23,36,74,.12); position: relative; max-width: 360px; }
.sel-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy); transition: width .35s cubic-bezier(.2,.8,.2,1); }
.sel-hint { margin: 0; font-family: var(--font-display); font-size: 12px; letter-spacing: .24em; color: var(--navy-soft); }
.sel-roster { grid-column: 1 / -1; list-style: none; margin: 18px 0 0; padding: 10px 2px 4px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.sel-roster::-webkit-scrollbar { display: none; }
.sel-roster li { flex: none; }
.sel-roster button { display: block; width: clamp(56px, 6.4vw, 84px); aspect-ratio: 1; padding: 0; border: 1px solid rgba(23,36,74,.16); background: var(--white); cursor: pointer; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
.sel-roster img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(.9); opacity: .55; transition: filter .25s, opacity .25s; }
.sel-roster button:hover img { opacity: .85; }
.sel-roster button.cur { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--navy); }
.sel-roster button.cur img { filter: none; opacity: 1; }
@media (max-width: 760px) {
  .sel-pin { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; align-content: center; row-gap: 14px; }
  .sel-stage { width: min(68vw, 40vh); }
  .sel-info { gap: 8px; justify-items: center; text-align: center; }
  .sel-idx b { font-size: 40px; }
  .sel-name { min-height: 2.6em; font-size: 18px; }
  .sel-hint { display: none; }
  .sel-roster { margin-top: 4px; }
}
@media (prefers-reduced-motion: reduce) { .sel-card img.in, .sel-name span, .sel-br.pulse { animation: none; } }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.gallery figure { margin: 0; min-width: 0; }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--white); border: 1px solid rgba(23,36,74,.1); }
.gallery figcaption { font-size: 14px; margin-top: 8px; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.cards3 > div { min-width: 0; }
.cards3 img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; margin-bottom: 14px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--navy); }
.steps > div { padding: 20px 20px 0 0; min-width: 0; }
.steps > div + div { padding-left: 20px; border-left: 1px solid rgba(23,36,74,.16); }
.steps b { font-family: var(--font-display); font-size: 20px; letter-spacing: .08em; display: block; margin-bottom: 6px; }
.qa > div { padding: 18px 0; border-bottom: 1px solid rgba(23,36,74,.16); }
.qa b { display: block; margin-bottom: 6px; }
.form { display: grid; gap: 16px; max-width: 640px; }
.form label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
.form input, .form textarea { font: inherit; color: var(--navy); background: var(--white); border: 1px solid rgba(23,36,74,.3); padding: 12px 14px; border-radius: 0; }
.form textarea { min-height: 160px; resize: vertical; }
.form button, .back-btn { justify-self: start; background: var(--navy); color: var(--white); border: 0; padding: 14px 28px; font-family: var(--font-display); letter-spacing: .14em; cursor: pointer; }
.form-note { font-size: 14px; color: var(--navy-soft); min-height: 1.6em; margin: 0; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 20px; }
.post { background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; display: grid; gap: 10px; align-content: start; min-width: 0; }
.post img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.post b { font-weight: 500; line-height: 1.45; }
.post small { color: var(--navy-soft); font-variant-numeric: tabular-nums; }
.post:hover b, .post:focus-visible b { text-decoration: underline; text-underline-offset: 4px; }
.article { max-width: 820px; }
.article img { width: 100%; height: auto; display: block; margin: 20px 0 28px; }
.pg-foot { background: var(--navy-deep); color: rgba(255,255,255,.72); padding-block: 44px calc(44px + env(safe-area-inset-bottom, 0px)); font-size: 13px; line-height: 1.9; }
.pg-foot strong { color: var(--white); font-family: var(--font-display); letter-spacing: .14em; font-weight: 500; }
@media (max-width: 800px) {
  .two, .cards3, .steps { grid-template-columns: 1fr; }
  .steps > div + div { padding-left: 0; border-left: 0; border-top: 1px solid rgba(23,36,74,.16); }
  .numbers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .numbers > div:nth-child(3) { border-left: 0; }
  .rows > div { grid-template-columns: 1fr; gap: 4px; }
}

button:focus-visible { outline: 2px solid #ff5a1f; outline-offset: -2px; }
@media (prefers-reduced-motion: reduce) {
  .intro { height: 100vh; } .about { height: auto; } .about-pin { position: relative; padding-block: 120px; height: auto; }

    ["성남, 공기청정기 브랜드 '에어텍'과 파트너십 협약 체결", '2025-02-28', 204, 'a_01', `<p>[스포탈코리아] 정현준 기자= 성남FC가 공기청정기 전문 제조사 에어텍(대표 박선영)과 파트너십 협약을 체결했다. 성남은 16일 보도자료를 통해 에어텍과 파트너십 협약을 맺었다고 발표했다. 이번 파트너십 협약으로 에어텍은 탄천종합운동장 E석 펜스에 성남 후반기 잔여 경기 동안 광고를 진행하게 된다.</p><p>성남시에 소재한 에어텍은 작고 강력한 공기청정기를 개발하겠다는 신념하에 설립한 공기청정기 전문 제조사이다. 에어텍은 중국산 공기청정기들이 시장을 활보하고 있는 국내시장에서 제품 100%를 국내 자체 공장에서 생산하고 있는 업체로서 “Made in Korea”의 우수성을 전세계에 알리기 위해 고군분투하고 있다. 특히 마블/디즈니와 라이선스 계약을 토대로 캐릭터 공기청정기라는 새로운 시장을 창출하면서 디자인에도 힘을 쏟고 있다.</p><p>(주) 에어텍 박선영 대표는 “성남 FC와 파트너십 협약을 체결하게 되어 매우 기쁘게 생각하며, 에어텍과 성남 FC가 각자의 분야에서 꾸준히 성장을 하여 구단과 회사가 서로 웃을 수 있는 좋은 사례로 남았으면 한다”는 후원 소감을 밝혔다. 한편, 성남은 앞으로도 꾸준한 파트너사 모집 활동을 진행할 예정이다. 사진=성남FC</p>`],
    ['태국 유통사에 청정기 독점납품 비결은…', '2025-02-28', 178, 'a_02', `<p class="muted">중소기업중앙회가 지난 4월 개최한 수출상담회에서 중소기업 관계자들이 해외 바이어와 상담하고 있다. [사진 제공 = 중소기업중앙회]</p><p><b>중소기업 수출 컨소시엄 프로그램 (下)</b> 성남 소재 중소기업 에어텍 · 지역 ICT와 공동 판로 개척 · 30만불 첫 수출…올 3배 늘듯 · 중기중앙회 "아마존·월마트 등 대형 유통망에 중기제품 진출"</p><p>수출 컨소시엄 사업은 중소벤처기업부가 기획하고 중소기업중앙회가 운영하는 수출 지원 프로그램으로 '전문업종 컨소시엄'과 '지역특화 컨소시엄' 투트랙 형식으로 기업을 묶어 해외 시장을 공략한다.</p><p>경기 성남에서 공기청정기 등 환경제품을 제조·판매하는 에어텍(대표 박선영)은 ICT 수출 컨소시엄으로 해외에 진출했다. 에어텍은 해외 시장 진출을 희망했지만 마케팅 자원과 정보가 부족해 현지 네트워크를 구축하는 데 어려움을 겪었다. 특히 수출 상대가 선진국 기업일수록 까다로운 조건을 제시해 수출을 포기하는 사례가 많아 현지 수출 전문가의 도움이 절실했다. 이에 지역특화 컨소시엄에 참여해 주관 단체인 성남산업진흥원와 함께 판로를 뚫는 데 성공했다.</p><p>지난해 에어텍은 태국 에어컨 전문 유통기업인 '폰차이' 그룹에 마블 공기청정기를 30만달러 규모로 수출하고, 마블 시리즈 태국 독점계약을 체결하는 등 성과를 올렸다. 최근 태국 내 미세먼지 영향과 마블 캐릭터 인기가 맞물려 수출액이 더 늘어날 것으로 예상된다.</p>`],
    ["에어텍, 유모차 전용 공기청정기 '에어비트' 출시", '2025-02-28', 208, 'a_03', `<p><b>충전 없이 6시간 이상 연속 재생 가능한 블루투스 겸용 공기청정기</b></p><p>중소벤처기업부와 창업진흥원의 창업사업화 지원 사업인 창업 도약 패키지 지원사업을 서원대학교 산학협력단을 통해 지원 받은 공기청정기 전문 제조사 ㈜에어텍이 유모차 전용 공기청정기 ‘에어비트’를 새롭게 선보이며 소형가전시장에서 주목받고 있다. 블루투스 스피커가 탑재된 휴대용 공기청정기 에어비트는 초미세먼지 여과에 최적화된 e-나노필름필터를 적용했다.</p><p>e-나노필름필터는 영구정전기력을 활용하는 원리로 흡입된 공기에 포함된 오염물질과 초미세먼지를 흡착 및 여과해 상쾌한 공기를 제공하고, 하나의 필터로 미세오염물질 포집과 냄새 제거 기능을 제공한다. 해당 필터는 시중에 유통되는 부직포 필터와 달리 오염된 공기와 수분이 유입돼도 2차 오염이 발생하지 않고, 필터 오염 시 세척 후 반복 재사용이 가능해 경제적으로도 효율적이다.</p><p>특히 디즈니 마블어벤저스 캐릭터를 접목한 디자인이며, 미세먼지는 성인보다 영유아에게 더 유해한 만큼, 가족 야외 나들이가 잦아지는 가을을 맞아 많은 부모들이 유모차용 공기청정기 제품에 많은 관심을 보이고 있다. 한 번 충전 후 무선 사용으로 6시간 이상 사용이 가능하고, 거치대를 활용해 다양한 장소에 설치 가능한 에어비트는, 유모차 주행 중에도 두 손 자유롭게 활동이 가능하다. 공기청정기능 구동 중에도 고음질의 음향 기능을 제공해 야외 활동 중 다목적으로 사용할 수도 있다. 또한 고정밀 공기질측정센서가 내장돼 각종 유해 물질을 오염도에 따라 4단계 색상으로 표시해 직관적으로 공기 질을 확인할 수 있다.</p><p class="muted">전자신문인터넷 형인우 기자 · 출처 : http://www.etnews.com/20191008000040</p>`],
    ['성남시 에어텍, 코로나19 예방 물품 기부', '2025-02-28', 179, 'a_04', `<p class="muted">28일 성남시청 시장 집무실에서 박선영 에어텍 대표가 은수미 성남시장(오른쪽)에게 손 세정제와 항균 탈취제 500개를 기탁한 후 기념촬영을 하고 있다. (사진 = 성남시)</p><p><b>손 세정제·항균 탈취제 500개 사회복지시설 보내</b></p><p>(경기=NSP통신) 김난이 기자 = 경기 성남시 스타트업 기업인 에어텍이 28일 코로나19 예방에 도움이 되고 싶다며 자사 제품인 손 세정제와 항균 탈취제 500개를 기탁했다. 시는 이날 오전 10시 시장 집무실에서 은수미 성남시장과 박선영 에어텍 대표, 류해필 성남산업진흥원장 등이 참석한 가운데 ‘700만원 상당 코로나 19 예방 물품 기부식’을 했다. 받은 물품은 손 세정제 300개, 항균 탈취제 200개다. 기부자의 뜻에 따라 사회복지시설·기관에 전달했다.</p><p>에어텍은 시 산하기관인 성남산업진흥원이 운영하는 제1비즈니스센터(중원구 상대원동 소재)에 지난 2018년 입주한 소형 공기청정기 전문 제조 업체다. 성남산업진흥원이 창업 단계부터 지원해 지난해 글로벌 수출 온라인 마켓인 구글, 유튜브, 인스타그램을 개설하고 지난달 미국 라스베이거스 CES(전자 쇼)에 참여했다. 이 업체는 앞선 지난 2015년 메르스 감염병 확산 당시 분당노인종합복지관에 공기청정기, 소독수 등 400만원 상당의 물품을 지원했다.</p><p class="muted">NSP통신 김난이 기자 · 2020-02-28</p>`]

  const ARTISTS = [
    { name: 'BTS', img: 'images/cut/bts.png', go: ['PRODUCTS', 'K-POP'] },
    { name: 'SEVENTEEN', img: 'images/cut/seventeen.png', go: ['PRODUCTS', 'K-POP', 'SEVENTEEN'] },
    { name: 'ENHYPEN', img: 'images/cut/enhypen.png', go: ['PRODUCTS', 'K-POP', 'ENHYPEN'] },
    { name: 'i-dle', img: 'images/cut/idle.png', go: ['PRODUCTS', 'K-POP'] },
    { name: 'HELLO KITTY & JISOO', img: 'images/cut/kitty_jisoo.png', go: ['PRODUCTS', 'CHARACTER'] }
  ];
  const artists = $('artists'), lineup = $('lineup'), artCount = $('artCount'), artHint = $('artHint');
  const noHover = matchMedia('(hover: none)').matches;
  if (noHover) artHint.textContent = 'SCROLL OR USE ARROWS · TAP FOR PRODUCTS';
  ARTISTS.forEach((a, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'idol'; b.setAttribute('aria-label', `${a.name} 제품 보기`);
    b.innerHTML = `<img alt="" decoding="async"><span class="tag"><i>${String(i + 1).padStart(2, '0')}</i><b></b></span><span class="go">VIEW PRODUCTS →</span>`;
    b.querySelector('b').textContent = a.name;
    a.im = b.querySelector('img'); a.im.addEventListener('load', sizeLineup); a.im.src = a.img;
    lineup.appendChild(b);
    a.el = b;
    b.addEventListener('click', () => go(a.go[0], a.go[1], b, a.go[2]));
  });
  let lineupW = 0, lineX = 0;
  function sizeLineup() {
    const H = innerWidth < 700 ? Math.min(innerHeight * .34, 300) : Math.min(innerHeight * .44, 430);
    lineup.style.setProperty('--h', H.toFixed(1) + 'px');
    lineupW = lineup.scrollWidth;
  }
  // Arrows: move the track so the previous / next artist sits in the middle (by scrolling the page, so scroll and arrows stay in sync)
  const artPrev = $('artPrev'), artNext = $('artNext');
  const artSpan = () => Math.max(0, lineupW - innerWidth);
  const xFor = a => clamp(innerWidth / 2 - (a.el.offsetLeft + a.el.offsetWidth / 2), -artSpan(), 0);
  const ioInv = u => u < .5 ? Math.cbrt(u / 4) : 1 - Math.cbrt(2 * (1 - u)) / 2;
  function artStep(dir) {
    const span = artSpan();
    if (!span) return;
    const xs = ARTISTS.map(xFor);
    const x = dir > 0 ? xs.find(v => v < lineX - 2) : xs.slice().reverse().find(v => v > lineX + 2);
    if (x == null) return;
    const t = .06 + .88 * ioInv(clamp(-x / span));
    scrollTo({ top: artists.offsetTop + t * (artists.offsetHeight - innerHeight), behavior: reduce ? 'auto' : 'smooth' });
  }
  artPrev.addEventListener('click', () => artStep(-1));
  artNext.addEventListener('click', () => artStep(1));
  function updateArtists(t) {
    // sideways track
    const span = artSpan();
    lineX = span > 0 ? -span * io(seg(t, .06, .94)) : (innerWidth - lineupW) / 2;
    lineup.style.transform = `translate(${lineX.toFixed(1)}px, -50%)`;
    // which artist sits nearest the middle of the screen
    let mid = 0, best = Infinity;
    ARTISTS.forEach((a, i) => { const r = a.el.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - innerWidth / 2); if (d < best) { best = d; mid = i; } });
    artCount.textContent = `${String(mid + 1).padStart(2, '0')} / ${String(ARTISTS.length).padStart(2, '0')}`;
    if (noHover) ARTISTS.forEach((a, i) => a.el.classList.toggle('on', i === mid));
    artPrev.disabled = !span || lineX > -2;
    artNext.disabled = !span || lineX < -span + 2;
  }
  /* ---------- Loop ---------- */
  function headerTheme() {
    if (forcedLight) { top.classList.remove('dark'); return; }
    const y = 40;
    for (const s of [intro, about, stats, artists]) {
      const r = s.getBoundingClientRect();
      if (r.top <= y && r.bottom > y) {
        let dark = s.dataset.theme === 'dark';
        if (s === intro) dark = introT > .8;
        top.classList.toggle('dark', dark); return;
      }
    }
  }
  function resize() { sizeIntro(); sizeLineup(); sizeFills(); }
  resize(); addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeFills);

  function frameLoop() {
    requestAnimationFrame(frameLoop);
    const vis = s => { const r = s.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };
    let docked = true;
    if (vis(intro)) docked = updateIntro(introT);
    top.classList.toggle('show', reduce || docked || pageOpen);
    if (vis(about)) updateAbout(progressOf(about));
    if (vis(stats)) updateStats(reduce ? 0 : progressOf(stats));
    if (vis(artists)) updateArtists(progressOf(artists));
    headerTheme();
  }
  requestAnimationFrame(frameLoop);
})();
</script>
